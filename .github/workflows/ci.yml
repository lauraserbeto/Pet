name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testes (unit + integração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Segredos fake apenas para o boot/config nos testes (não conectam a nada real).
      JWT_SECRET: ci-dummy-secret-com-mais-de-32-caracteres-0000
      DATABASE_URL: postgresql://user:pass@localhost:5432/petplus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Testes (node:test + supertest)
        run: npm test

  frontend:
    name: Frontend — typecheck, testes & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E — smoke (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E smoke
        run: npm run test:e2e

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testes (unit + integração)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: petplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d petplus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # Segredos fake apenas para o boot/config nos testes.
      JWT_SECRET: ci-dummy-secret-com-mais-de-32-caracteres-0000
      DATABASE_URL: postgresql://user:pass@localhost:5432/petplus_test
      FRONTEND_URL: http://localhost:5173
      RESEND_API_KEY: ci-resend-api-key
      EMAIL_FROM: no-reply@petplus.test
      LOG_LEVEL: silent
      RUN_DB_INTEGRATION_TESTS: 'true'
      NODE_ENV: test
      SENTRY_DSN: ''
      MERCADO_PAGO_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Auditoria de dependências (high/critical bloqueantes)
        run: npm audit --audit-level=high
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrations do banco de teste
        run: npx prisma migrate deploy
      - name: Testes (node:test + supertest)
        run: npm test -- --test-concurrency=2
      - name: Build da imagem de produção
        run: docker build --tag petplus-backend:ci .
      - name: Imagem sem root e com Prisma gerado
        run: >-
          docker run --rm --entrypoint node petplus-backend:ci -e
          "if (process.getuid() === 0) throw Error('Imagem executando como root');
          new (require('@prisma/client').PrismaClient)();
          if (require('node:fs').existsSync('/app/.env')) throw Error('Arquivo .env na imagem');"

  frontend:
    name: Frontend — typecheck, testes & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Auditoria de dependências (high/critical bloqueantes)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários (Vitest)
        run: npm test -- --pool=forks --maxWorkers=2
      - name: Build
        run: npm run build

  e2e:
    # ATENÇÃO: este nome é o contrato com a régua de proteção da `main`, que
    # exige o contexto `E2E — smoke (Playwright)` por nome exato. Renomear o job
    # sem atualizar a régua antes faz o merge travar esperando para sempre um
    # check que nunca será reportado. O job já NÃO é mais um smoke: ele roda as
    # jornadas completas (ver o passo abaixo). Para corrigir o nome, alguém com
    # admin precisa trocar o contexto em Settings → Rules no mesmo movimento.
    name: E2E — smoke (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    # Os specs `*-real.spec.ts` exigem fixture e API local; sem o Postgres abaixo
    # eles PULAM e o job fica verde sem ter verificado nada (QA-2).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: petplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d petplus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-dummy-secret-com-mais-de-32-caracteres-0000
      RESEND_API_KEY: ci-resend-api-key
      EMAIL_FROM: no-reply@petplus.test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          # Dois lockfiles: o job instala backend e frontend.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependências (backend)
        run: npm ci
        working-directory: backend
      - name: Instalar dependências (frontend)
        run: npm ci
        working-directory: frontend
      - name: Instalar Playwright (chromium)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Mesmo script usado na máquina do desenvolvedor: prepara os bancos,
      # gera as fixtures, sobe a API e roda a suíte. Se o caminho divergir
      # entre CI e local, o CI volta a ser teatro.
      - name: Rodar jornadas E2E
        run: ./scripts/e2e-full.sh
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

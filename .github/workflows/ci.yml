name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testes (unit + integração)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: petplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d petplus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # Segredos fake apenas para o boot/config nos testes.
      JWT_SECRET: ci-dummy-secret-com-mais-de-32-caracteres-0000
      DATABASE_URL: postgresql://user:pass@localhost:5432/petplus_test
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: silent
      RUN_DB_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Auditoria de dependências (não-bloqueante)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrations do banco de teste
        run: npx prisma migrate deploy
      - name: Testes (node:test + supertest)
        run: npm test

  frontend:
    name: Frontend — typecheck, testes & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Auditoria de dependências (não-bloqueante)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E — smoke (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E smoke
        run: npm run test:e2e

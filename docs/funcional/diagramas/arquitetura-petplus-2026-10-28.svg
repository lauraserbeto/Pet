<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <style>
      .camada { font-size: 17px; font-weight: bold; fill: #1f2937; }
      .titulo { font-size: 15px; font-weight: bold; fill: #111827; }
      .sub { font-size: 12.5px; fill: #374151; }
      .rotulo { font-size: 13px; fill: #111827; }
      .linha { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1050" fill="#ffffff"/>

  <!-- Camada de Apresentação -->
  <rect x="30" y="20" width="1140" height="160" rx="8" fill="#fdf2fb" stroke="#e5a3d6" stroke-width="1.5"/>
  <text x="600" y="48" text-anchor="middle" class="camada">Camada de Apresentação – Front-end (React 18 + Vite, hospedado na Vercel)</text>

  <rect x="80" y="75" width="230" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="195" y="108" text-anchor="middle" class="titulo">Visão do Tutor</text>
  <text x="195" y="130" text-anchor="middle" class="sub">(Web)</text>

  <rect x="350" y="75" width="230" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="465" y="108" text-anchor="middle" class="titulo">Visão do Lojista</text>
  <text x="465" y="130" text-anchor="middle" class="sub">(Web)</text>

  <rect x="620" y="75" width="230" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="735" y="108" text-anchor="middle" class="titulo">Visão do Hotel e do Pet Sitter</text>
  <text x="735" y="130" text-anchor="middle" class="sub">(Web)</text>

  <rect x="890" y="75" width="230" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1005" y="108" text-anchor="middle" class="titulo">Visão do Administrador</text>
  <text x="1005" y="130" text-anchor="middle" class="sub">(Web)</text>

  <!-- Camada de Aplicação -->
  <rect x="30" y="255" width="1140" height="600" rx="8" fill="#ecfdf9" stroke="#5cc8b4" stroke-width="1.5"/>
  <text x="60" y="812" class="camada">Camada de Aplicação e Integração</text>
  <text x="60" y="836" class="camada">Back-end (hospedado na Railway)</text>

  <rect x="390" y="298" width="420" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="330" text-anchor="middle" class="titulo">API REST – Node.js + Express 5</text>
  <text x="600" y="354" text-anchor="middle" class="sub">Helmet | CORS | autenticação JWT | Swagger (/api-docs)</text>

  <!-- Requisições -->
  <path class="linha" d="M195,150 V215 H540 V296"/>
  <path class="linha" d="M465,150 V205 H570 V296"/>
  <path class="linha" d="M735,150 V205 H630 V296"/>
  <path class="linha" d="M1005,150 V215 H660 V296"/>
  <rect x="740" y="221" width="380" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="930" y="238" text-anchor="middle" class="rotulo">Requisições HTTP/REST em JSON (JWT nas rotas privadas)</text>

  <path class="linha" d="M600,378 V418"/>

  <!-- Módulos de Negócio -->
  <rect x="60" y="420" width="1080" height="250" rx="8" fill="#fff7ed" stroke="#f0b45a" stroke-width="1.5"/>
  <text x="600" y="446" text-anchor="middle" class="camada">Módulos de Negócio</text>

  <rect x="80" y="465" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="195" y="498" text-anchor="middle" class="titulo">Autenticação e usuários</text>
  <text x="195" y="521" text-anchor="middle" class="sub">JWT + bcryptjs</text>

  <rect x="350" y="465" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="465" y="498" text-anchor="middle" class="titulo">Parceiros e moderação</text>
  <text x="465" y="521" text-anchor="middle" class="sub">aprovação, recusa e reenvio</text>

  <rect x="620" y="465" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="735" y="498" text-anchor="middle" class="titulo">Pets, endereços e favoritos</text>
  <text x="735" y="521" text-anchor="middle" class="sub">dados do tutor</text>

  <rect x="890" y="465" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1005" y="498" text-anchor="middle" class="titulo">Produtos, carrinho e pedidos</text>
  <text x="1005" y="521" text-anchor="middle" class="sub">estoque e compras</text>

  <rect x="215" y="568" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="330" y="601" text-anchor="middle" class="titulo">Pagamentos</text>
  <text x="330" y="624" text-anchor="middle" class="sub">simulado e Mercado Pago (sandbox)</text>

  <rect x="485" y="568" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="601" text-anchor="middle" class="titulo">Serviços e agendamentos</text>
  <text x="600" y="624" text-anchor="middle" class="sub">hotéis e Pet Sitters</text>

  <rect x="755" y="568" width="230" height="78" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="870" y="601" text-anchor="middle" class="titulo">Integrações</text>
  <text x="870" y="624" text-anchor="middle" class="sub">Resend, ViaCEP e Sentry (opcional)</text>

  <path class="linha" d="M600,670 V718"/>

  <rect x="460" y="720" width="280" height="80" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="753" text-anchor="middle" class="titulo">Prisma ORM</text>
  <text x="600" y="776" text-anchor="middle" class="sub">consultas e migrations versionadas</text>

  <!-- Camada de Dados -->

  <rect x="400" y="880" width="400" height="150" rx="8" fill="#ecfeff" stroke="#67c7d9" stroke-width="1.5"/>
  <text x="420" y="905" class="camada">Camada de Dados</text>
  <path class="linha" d="M600,800 V916"/>
  <rect x="560" y="842" width="80" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="600" y="859" text-anchor="middle" class="rotulo">SQL</text>
  <path d="M520,932 a80,14 0 0 0 160,0 a80,14 0 0 0 -160,0 v62 a80,14 0 0 0 160,0 v-62" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="975" text-anchor="middle" class="titulo">PostgreSQL</text>
  <text x="600" y="996" text-anchor="middle" class="sub">(Railway)</text>
</svg>

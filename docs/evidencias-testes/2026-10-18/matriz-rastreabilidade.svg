<text x="60" y="160" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#146d4a"><tspan x="60" dy="0">Recorte: 119 testes | 119 aprovados | 0 falhas | 0 ignorados</tspan></text>

<line x1="50" y1="1140" x2="1750" y2="1140" stroke="#cbd6de"/>
<text x="60" y="1186" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#123149"><tspan x="60" dy="0">Resultado do teste não equivale ao aceite integral do requisito.</tspan></text>
<text x="60" y="1227" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#465b6c"><tspan x="60" dy="0">* IDs propostos na revisão documental; confirmar numeração no documento final.</tspan></text>
<text x="60" y="1263" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#465b6c"><tspan x="60" dy="0">Recorte local com simulações. Não inclui PostgreSQL real, navegador E2E ou validação externa.</tspan></text>
